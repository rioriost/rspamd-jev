name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install test runtimes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit rspamd
      - name: Offline tests
        run: make test
      - name: Isolated native Rspamd smoke test
        run: |
          for scenario in disabled standalone gpt observe; do
            python3 tests/smoke_rspamd.py --scenario "$scenario"
          done
