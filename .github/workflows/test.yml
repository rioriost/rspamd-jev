name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test runtimes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit rspamd
      - name: Offline tests
        run: make test
      - name: Isolated native Rspamd smoke test
        run: python3 tests/smoke_rspamd.py
