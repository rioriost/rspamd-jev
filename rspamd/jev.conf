# Include INSIDE a jev { ... } block; see README.md.
enabled = false;
mode = "mock";
url = "http://127.0.0.1:18080/v1/systemone";
model = "jev-1.13.0";
allow_external = false;
# Set an absolute path readable by Rspamd before switching to live mode.
api_key_file = "";
recipient_domains = [];

# Optional: require an existing gpt module result before querying Jev.
# false works with plain Rspamd; true requires GPT_CHECK and GPT_* results.
require_gpt = false;
sample_rate = 0.05;
timeout = 1.5;

# PER WORKER, not global. No retries or cache.
requests_per_second = 1;
max_inflight = 2;
cooldown = 60;

max_message_bytes = 1048576;
max_body_bytes = 6000;
max_request_bytes = 24576;
max_urls = 16;
max_attachments = 8;

# Only changes observation labels; never changes scores or actions.
probability_threshold = 0.9;
confidence_threshold = 0.9;
